connector.class=com.github.dariobalinzo.ElasticSourceConnector
tasks.max=1
es.host=localhost
es.port=9200
index.prefix=my_awesome_index
# Alternatively, use regex pattern to match indices (takes precedence over index.prefix):
# index.regex=dev-tenant-.*-content-v.*
topic.prefix=es_
incrementing.field.name=@timestamp

# Heartbeat configuration
# Send heartbeat messages every 60 seconds (60000 ms)
# Set to 0 to disable heartbeat (default)
heartbeat.interval.ms=60000
# Heartbeat topic will be: __debezium-heartbeat.es_
topic.heartbeat.prefix=__debezium-heartbeat
